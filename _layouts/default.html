!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "The White Witch™" }}</title>
  <meta name="description" content="{{ page.description | default: '' }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-min.css">
  <style>
    body { background: #0d1117; color: #c9d1d9; margin: 0; }
    .markdown-body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; background: #0d1117; color: #c9d1d9; }
    .markdown-body a { color: #58a6ff; }
    .markdown-body img { max-width: 100%; height: auto; }
    .markdown-body hr { border-color: #30363d; }
  </style>
</head>
<body>
  <article class="markdown-body">
    {{ content }}
  </article>
</body>
</html>
