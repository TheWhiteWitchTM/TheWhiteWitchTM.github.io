title: The White Witch™
description: LibreSky in two editions, SociallyDead, MAGIC, and RETRO MAGIC. Mira's World and Emoji Games. Qt apps by The White Witch. Blogy, MAGIC Dock, Cinder, and Vesper.
keywords: The White Witch, Mira, Mira's World, LibreSky, LibreSky Corporate, SociallyDead, MAGIC, RETRO MAGIC, RETRO Center, Emoji Games, Blogy, MAGIC Dock, Cinder, Vesper, FAUX NEWS
url: "https://thewhitewitchtm.github.io"
baseurl: ""
image: /assets/images/banner.jpg

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Mira's World is a Next.js export in /mira. Jekyll drops every name that
# starts with "_" or ".", including /mira/_next, unless it is listed here.
include:
  - _next
  - _not-found
  - _buildManifest.js
  - _clientMiddlewareManifest.js
  - _ssgManifest.js
  - __next.__PAGE__.txt
  - __next._full.txt
  - __next._index.txt
  - __next._not-found.__PAGE__.txt
  - __next._tree.txt
  - __next.blog.$c$slug.__PAGE__.txt
  - __next.blog.__PAGE__.txt
  - __next.projects.emoji-ui.__PAGE__.txt
  - __next.projects.next-blog.__PAGE__.txt
  - __next.projects.next-static.__PAGE__.txt
  - __next.tools.__PAGE__.txt
  - __next.tools.emoji.__PAGE__.txt
  - __next.tools.flags.__PAGE__.txt
  - __next.tools.image-magic.__PAGE__.txt
  - __next.tools.webfont.__PAGE__.txt
  - __next.tutorials.markdown.__PAGE__.txt
  - __next.tutorials.tailwind.__PAGE__.txt

feed:
  path: /feed.xml
  posts_limit: 20
