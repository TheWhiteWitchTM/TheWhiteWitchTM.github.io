<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | default: "The White Witch™" }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧙‍♀️</text></svg>">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} Feed" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.css">
  {% include gtag.html %}
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --accent: #c9a6ff;
      --line: #2a2433;
      --nav-h: 3.25rem;
      --banner-h: clamp(76px, 7.5vw, 104px);
      --chrome-h: calc(var(--nav-h) + env(safe-area-inset-top));
      color-scheme: dark;
    }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      line-height: 1.6;
      padding-top: var(--chrome-h);
      -webkit-font-smoothing: antialiased;
    }
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: calc(var(--nav-h) + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      background: #0a0a0a;
      border-bottom: 1px solid #1f1f1f;
    }
    .nav-inner {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .site-title {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.01em;
    }
    .site-title:hover { color: var(--accent); }
    .coffee {
      color: var(--accent) !important;
      text-decoration: none;
      font-weight: 600;
      padding: 0.4em 0.85em;
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: background 0.15s;
    }
    .coffee:hover { background: #c9a6ff22; }
    .site-banner-wrap {
      display: flex;
      justify-content: center;
      height: var(--banner-h);
      overflow: hidden;
      background: #000;
      border-bottom: 1px solid #161616;
    }
    .site-banner {
      width: min(100%, calc(var(--banner-h) * 6.35));
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
      display: block;
    }
    main {
      flex: 1 0 auto;
      width: 100%;
    }
    .markdown-body {
      box-sizing: border-box;
      max-width: 980px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
      background: var(--bg);
      color: var(--text);
    }
    .markdown-body a { color: var(--accent); }
    .markdown-body hr { border-color: #30363d; }
    .site-footer {
      margin-top: auto;
      background: #0a0a0a;
      border-top: 1px solid #1f1f1f;
      padding: 1.1rem 1.5rem 1.3rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem 0.75rem;
      flex-wrap: wrap;
    }
    .footer-links a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer-links a:hover { color: #e8d5ff; }
    /* Card styles for index showcase */
    .row { display: flex; flex-wrap: wrap; gap: 1.2rem; margin: 1.5rem 0; }
    .card { flex: 1 1 280px; max-width: 420px; background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; transition: border-color 0.15s; }
    .card:hover { border-color: var(--accent); }
    .card a { color: var(--accent); text-decoration: none; }
    .card a:hover { text-decoration: underline; }
    .card img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .card h3 { margin: 0; padding: 0.75rem 1rem 0.3rem; font-size: 1.15em; }
    .card p { margin: 0; padding: 0.4rem 1rem 1rem; font-size: 0.92em; line-height: 1.4; color: #c9d1d9; }
  </style>
</head>
<body>
  {% include nav.html %}

  {% unless page.hide_banner %}
  <div class="site-banner-wrap">
    <img src="{{ page.banner | default: '/assets/images/banner.jpg' | relative_url }}" alt="{{ page.banner_alt | default: 'The White Witch banner' }}" class="site-banner">
  </div>
  {% endunless %}

  <main>
    <article class="markdown-body">
      {{ content }}
    </article>
  </main>

  {% include footer.html %}
  {% include scripts.html %}
</body>
</html>
