title: The White Witch™
description: LibreSky in two editions, SociallyDead, MAGIC, and RETRO MAGIC. Mira's World and Emoji Games. Qt apps by The White Witch. Blogy, MAGIC Dock, Cinder, and Vesper.
keywords: The White Witch, Mira, Mira's World, LibreSky, LibreSky Corporate, SociallyDead, MAGIC, RETRO MAGIC, RETRO Center, Emoji Games, Blogy, MAGIC Dock, Cinder, Vesper, FAUX NEWS
url: "https://thewhitewitchtm.github.io"
baseurl: ""
image: /assets/images/banner.jpg

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Mira's World is a Next.js export in /mira. Jekyll drops every name that
# starts with "_" or ".", including /mira/_next, unless it is listed here.
include:
  - .nojekyll
  - __next.__PAGE__.txt
  - __next._full.txt
  - __next._index.txt
  - __next._not-found.__PAGE__.txt
  - __next._tree.txt
  - __next.about.__PAGE__.txt
  - __next.ai.$d$slug.__PAGE__.txt
  - __next.ai.__PAGE__.txt
  - __next.blog.$d$slug.__PAGE__.txt
  - __next.blog.__PAGE__.txt
  - __next.cards.__PAGE__.txt
  - __next.datenschutz.__PAGE__.txt
  - __next.en.__PAGE__.txt
  - __next.en.about.__PAGE__.txt
  - __next.en.contact.__PAGE__.txt
  - __next.en.impressum.__PAGE__.txt
  - __next.en.privacy.__PAGE__.txt
  - __next.en.services.__PAGE__.txt
  - __next.impressum.__PAGE__.txt
  - __next.kontakt.__PAGE__.txt
  - __next.leistungen.__PAGE__.txt
  - __next.projects.__PAGE__.txt
  - __next.tools.__PAGE__.txt
  - __next.tools.calling-card.__PAGE__.txt
  - __next.tools.emoji.__PAGE__.txt
  - __next.tools.flags.__PAGE__.txt
  - __next.tools.image-magic.__PAGE__.txt
  - __next.tools.post-meter.__PAGE__.txt
  - __next.tools.unfurl.__PAGE__.txt
  - __next.tools.webfont.__PAGE__.txt
  - __next.tutorials.$d$slug.__PAGE__.txt
  - __next.tutorials.__PAGE__.txt
  - __next.ueber.__PAGE__.txt
  - _buildManifest.js
  - _clientMiddlewareManifest.js
  - _next
  - _not-found
  - _ssgManifest.js

feed:
  path: /feed.xml
  posts_limit: 20
